<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabito FC - Iniciar Sesión</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        arabito: {
                            red: '#D32F2F',
                            'red-hover': '#B71C1C',
                            green: '#2E7D32',
                            blue: '#0288D1',
                            gold: '#FBC02D'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para Íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full flex flex-col justify-center items-center p-4 selection:bg-arabito-red selection:text-white">

    <!-- Fondo con patrón sutil y resplandor -->
    <div class="fixed inset-0 -z-10 overflow-hidden">
        <div class="absolute -top-[20%] -left-[10%] w-[500px] h-[500px] bg-arabito-red/10 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-[20%] -right-[10%] w-[500px] h-[500px] bg-arabito-blue/10 rounded-full blur-[120px]"></div>
    </div>

    <!-- Contenedor Principal de la Tarjeta -->
    <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-md border border-slate-800 rounded-3xl shadow-2xl overflow-hidden relative transition-all">
        
        <!-- Franja Superior Representativa del Escudo -->
        <div class="h-2 w-full flex">
            <div class="w-1/3 bg-arabito-red"></div>
            <div class="w-1/3 bg-arabito-blue"></div>
            <div class="w-1/3 bg-arabito-green"></div>
        </div>

        <div class="p-8 sm:p-10">
            <!-- Header con Logo e Identidad -->
            <div class="flex flex-col items-center text-center mb-8">
                <div class="relative group mb-4">
                    <div class="absolute -inset-1 bg-gradient-to-r from-arabito-red via-arabito-blue to-arabito-green rounded-full blur opacity-30 group-hover:opacity-75 transition duration-500"></div>
                    <div class="relative w-28 h-32 flex items-center justify-center p-1 bg-slate-900 rounded-2xl border border-slate-800">
                        <img src="/frontend/assets/logo-arabito.png" alt="Escudo Arabito FC" class="max-h-full max-w-full object-contain drop-shadow-md">
                    </div>
                </div>
                <h1 class="text-2xl font-black text-white tracking-wider uppercase font-sans">Arabito FC</h1>
                <p class="text-slate-400 text-xs mt-1 font-medium tracking-wide">SISTEMA DE GESTIÓN Y CONTROL ACADÉMICO</p>
            </div>

            <!-- Alerta de Notificación / Error -->
            <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-xs font-semibold flex items-start gap-3 transition-all border">
                <i id="alert-icon" class="fa-solid fa-circle-exclamation text-base mt-0.5"></i>
                <div id="alert-message"></div>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <form id="login-form" class="space-y-5" autocomplete="off">
                <!-- Campo: Correo -->
                <div>
                    <label for="email" class="block text-slate-300 text-xs font-bold uppercase tracking-wider mb-2">Correo Electrónico</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <input 
                            type="email" 
                            id="email" 
                            name="username" 
                            required 
                            placeholder="admin@arabitofc.com"
                            class="w-full pl-10 pr-4 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-600 text-sm focus:outline-none focus:border-arabito-red focus:ring-1 focus:ring-arabito-red transition-all"
                        >
                    </div>
                </div>

                <!-- Campo: Contraseña -->
                <div>
                    <label for="password" class="block text-slate-300 text-xs font-bold uppercase tracking-wider mb-2">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required 
                            placeholder="••••••••"
                            class="w-full pl-10 pr-10 py-3 bg-slate-950/60 border border-slate-800 rounded-xl text-white placeholder-slate-600 text-sm focus:outline-none focus:border-arabito-red focus:ring-1 focus:ring-arabito-red transition-all"
                        >
                        <button 
                            type="button" 
                            id="toggle-password" 
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 focus:outline-none"
                            tabindex="-1"
                        >
                            <i class="fa-solid fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- Botón Iniciar Sesión -->
                <button 
                    type="submit" 
                    id="btn-submit"
                    class="w-full py-3.5 px-4 bg-arabito-red hover:bg-arabito-red-hover text-white font-bold text-sm rounded-xl shadow-lg shadow-arabito-red/20 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 cursor-pointer mt-2"
                >
                    <span id="btn-text">INGRESAR AL SISTEMA</span>
                    <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-800/80 text-center">
                <p class="text-[11px] text-slate-500 font-medium">
                    Plataforma Oficial de Administración &copy; Arabito FC
                </p>
            </div>
        </div>
    </div>

    <!-- Script JS para Autenticación y Conexión con FastAPI -->
    <script>
        const API_URL = "http://127.0.0.1:8000";

        // Referencias a Elementos DOM
        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('toggle-password');
        const eyeIcon = document.getElementById('eye-icon');
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        const alertIcon = document.getElementById('alert-icon');
        const btnSubmit = document.getElementById('btn-submit');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');

        // Toggle Mostrar/Ocultar Contraseña
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        });

        // Función para mostrar Alertas
        function showAlert(message, type = 'error') {
            alertBox.classList.remove('hidden', 'bg-red-950/80', 'border-red-800', 'text-red-200', 'bg-emerald-950/80', 'border-emerald-800', 'text-emerald-200');
            
            if (type === 'error') {
                alertBox.classList.add('bg-red-950/80', 'border-red-800', 'text-red-200');
                alertIcon.className = 'fa-solid fa-circle-exclamation text-base mt-0.5 text-red-400';
            } else {
                alertBox.classList.add('bg-emerald-950/80', 'border-emerald-800', 'text-emerald-200');
                alertIcon.className = 'fa-solid fa-circle-check text-base mt-0.5 text-emerald-400';
            }

            alertMessage.innerText = message;
        }

        // Función auxiliar para decodificar JWT sin librerías externas
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        // Auto-redirección si ya existe token válido
        window.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('access_token');
            if (token) {
                const payload = parseJwt(token);
                // Si el token aún no ha expirado
                if (payload && payload.exp * 1000 > Date.now()) {
                    window.location.href = 'dashboard.html';
                } else {
                    localStorage.clear();
                    showAlert("Tu sesión ha expirado. Por favor inicia sesión de nuevo.", "error");
                }
            }
        });

        // Evento Submit de Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading state
            btnSubmit.disabled = true;
            btnText.innerText = "VERIFICANDO...";
            btnSpinner.classList.remove('hidden');
            alertBox.classList.add('hidden');

            const formData = new URLSearchParams();
            formData.append('username', emailInput.value.trim());
            formData.append('password', passwordInput.value);

            try {
                const response = await fetch(`${API_URL}/token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Error al autenticar');
                }

                // Decodificar payload para guardar el rol e identidad
                const payload = parseJwt(data.access_token);
                
                // Guardar credenciales en LocalStorage
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('user_email', payload.sub || emailInput.value.trim());
                localStorage.setItem('user_role', payload.rol || 'entrenador');

                showAlert("¡Acceso exitoso! Redirigiendo...", "success");

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);

            } catch (error) {
                let errorMsg = "Ocurrió un error. Intenta nuevamente.";
                if (error.message.includes("Correo o contraseña")) {
                    errorMsg = "Correo electrónico o contraseña incorrectos.";
                } else if (error.message.includes("Failed to fetch")) {
                    errorMsg = "No se pudo conectar con el servidor Backend FastAPI.";
                }
                showAlert(errorMsg, "error");
            } finally {
                btnSubmit.disabled = false;
                btnText.innerText = "INGRESAR AL SISTEMA";
                btnSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
